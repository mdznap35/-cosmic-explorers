name: Quality Gate and Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmic-explorers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify project and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Godot 4.7.2 and matching export templates
        uses: SolarLabyrinth/Action-Setup-Godot@d9f6c080367bc8e35dd623433be29e9f59f53a87 # v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Confirm pinned engine version
        shell: bash
        run: |
          godot --version
          godot --version | grep -F "4.7.2.stable"

      - name: Import and parse all project resources
        run: godot --headless --editor --path . --quit

      - name: Validate catalog and orbital math
        run: godot --headless --path . --script res://tests/validate_catalog.gd

      - name: Validate mission questions and source provenance
        run: godot --headless --path . --script res://tests/validate_missions.gd

      - name: Run main-scene smoke test
        run: godot --headless --path . --quit-after 5

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ''

      - name: Install Android platform and build tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          sdkmanager --sdk_root="$SDK_ROOT" --licenses < <(yes)
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Create temporary debug signing key
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/cosmic-debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android export paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/adb = "$ANDROID_HOME/platform-tools/adb"
          export/android/jarsigner = "$JAVA_HOME/bin/jarsigner"
          export/android/debug_keystore = "$RUNNER_TEMP/cosmic-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/CosmicExplorers-Android-debug.apk
          test -s build/CosmicExplorers-Android-debug.apk
          unzip -t build/CosmicExplorers-Android-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.1/aapt"
          "$AAPT" dump badging build/CosmicExplorers-Android-debug.apk | tee build/apk-badging.txt
          grep -F "package: name='org.mdznap35.cosmicexplorers'" build/apk-badging.txt
          "$AAPT" dump permissions build/CosmicExplorers-Android-debug.apk | tee build/apk-permissions.txt
          if grep -q "android.permission.INTERNET" build/apk-permissions.txt; then
            echo "Unexpected internet permission in the offline-first child app." >&2
            exit 1
          fi
          sha256sum build/CosmicExplorers-Android-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CosmicExplorers-Android-debug
          path: build/CosmicExplorers-Android-debug.apk
          if-no-files-found: error
          retention-days: 14
