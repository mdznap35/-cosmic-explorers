name: Quality Gate and Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmic-explorers-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify project and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out pinned planetary texture source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Sanghel/solar-system-3d
          ref: 47c8bbc6b63f4c6c2310911238c2c4b6bff6d20b
          path: .asset-source/solar-system-3d
          sparse-checkout: |
            public/textures
          sparse-checkout-cone-mode: false

      - name: Stage licensed planetary maps for offline runtime
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=".asset-source/solar-system-3d/public/textures"
          DEST="assets/planetary_textures"
          mkdir -p "$DEST"
          for body in sun mercury venus earth mars jupiter saturn uranus neptune; do
            test -s "$SOURCE/$body.jpg"
            cp "$SOURCE/$body.jpg" "$DEST/$body.jpg"
          done
          cp "$SOURCE/README.md" "$DEST/SOURCE_ATTRIBUTION.md"
          (
            cd "$DEST"
            sha256sum sun.jpg mercury.jpg venus.jpg earth.jpg mars.jpg jupiter.jpg saturn.jpg uranus.jpg neptune.jpg > SHA256SUMS
          )
          test "$(find "$DEST" -maxdepth 1 -name '*.jpg' | wc -l)" -eq 9
          cat "$DEST/SHA256SUMS"
          rm -rf .asset-source

      - name: Check out pinned KayKit Space Base Bits source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: KayKit-Game-Assets/KayKit-Space-Base-Bits-1.0
          ref: 6dfbcac9927d06283752c4defd4882cfe0d29666
          path: .asset-source/kaykit-space-base-bits
          sparse-checkout: |
            addons/kaykit_space_base_bits/Assets/gltf
            addons/kaykit_space_base_bits/Assets/LICENSE.txt
          sparse-checkout-cone-mode: false

      - name: Stage selected CC0 space-base models for offline runtime
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=".asset-source/kaykit-space-base-bits/addons/kaykit_space_base_bits/Assets"
          DEST="assets/vendor/kaykit_space_base_bits"
          SOURCE_COMMIT="6dfbcac9927d06283752c4defd4882cfe0d29666"
          test "$(git -C .asset-source/kaykit-space-base-bits rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p "$DEST"
          for model in basemodule_A lander_A landingpad_small rocks_A rocks_B solarpanel spacetruck structure_low; do
            test -s "$SOURCE/gltf/$model.gltf"
            test -s "$SOURCE/gltf/$model.bin"
            cp "$SOURCE/gltf/$model.gltf" "$DEST/$model.gltf"
            cp "$SOURCE/gltf/$model.bin" "$DEST/$model.bin"
          done
          cp "$SOURCE/gltf/spacebits_texture.png" "$DEST/spacebits_texture.png"
          cp "$SOURCE/LICENSE.txt" "$DEST/LICENSE.txt"
          test "$(find "$DEST" -maxdepth 1 -name '*.gltf' | wc -l)" -eq 8
          test "$(find "$DEST" -maxdepth 1 -name '*.bin' | wc -l)" -eq 8
          (
            cd "$DEST"
            sha256sum LICENSE.txt *.bin *.gltf spacebits_texture.png | sort -k2 > SHA256SUMS
          )
          echo "Pinned KayKit source: $SOURCE_COMMIT"
          echo "Selected models: 8 GLTF scenes with buffers, one shared texture and CC0 license."
          cat "$DEST/SHA256SUMS"
          rm -rf .asset-source/kaykit-space-base-bits

      - name: Install Godot 4.7.2 and matching export templates
        uses: SolarLabyrinth/Action-Setup-Godot@d9f6c080367bc8e35dd623433be29e9f59f53a87 # v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Confirm pinned engine version
        shell: bash
        run: |
          set -euo pipefail
          godot --version | tee "$RUNNER_TEMP/godot-version.txt"
          grep -F "4.7.2.stable" "$RUNNER_TEMP/godot-version.txt"

      - name: Import and parse all project resources
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/godot-import.log"; then
            echo "Godot reported a resource or script error during project import." >&2
            exit 1
          fi

      - name: Validate catalog and orbital math
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/validate_catalog.gd 2>&1 | tee "$RUNNER_TEMP/catalog-test.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/catalog-test.log"; then
            echo "Planet catalog or orbital math validation failed." >&2
            exit 1
          fi

      - name: Validate mission questions and source provenance
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/validate_missions.gd 2>&1 | tee "$RUNNER_TEMP/mission-test.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/mission-test.log"; then
            echo "Mission content validation failed." >&2
            exit 1
          fi

      - name: Validate planetary visual resources
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/validate_visual_resources.gd 2>&1 | tee "$RUNNER_TEMP/visual-test.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/visual-test.log"; then
            echo "Planetary visual resource validation failed." >&2
            exit 1
          fi

      - name: Validate guided exploration trail
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/validate_guided_expedition.gd 2>&1 | tee "$RUNNER_TEMP/guided-expedition-test.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/guided-expedition-test.log"; then
            echo "Guided expedition validation failed." >&2
            exit 1
          fi

      - name: Validate data-driven story and mission content
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/validate_content_registry.gd 2>&1 | tee "$RUNNER_TEMP/content-registry-test.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/content-registry-test.log"; then
            echo "Data-driven content validation failed." >&2
            exit 1
          fi

      - name: Validate playable character roster and abilities
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/validate_character_roster.gd 2>&1 | tee "$RUNNER_TEMP/character-roster-test.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/character-roster-test.log"; then
            echo "Character roster validation failed." >&2
            exit 1
          fi

      - name: Validate interaction event routing
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/validate_interaction_router.gd 2>&1 | tee "$RUNNER_TEMP/interaction-router-test.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/interaction-router-test.log"; then
            echo "Interaction router validation failed." >&2
            exit 1
          fi

      - name: Validate branching dialogue runtime
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/validate_dialogue_director.gd 2>&1 | tee "$RUNNER_TEMP/dialogue-director-test.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/dialogue-director-test.log"; then
            echo "Dialogue director validation failed." >&2
            exit 1
          fi

      - name: Validate mission progression and reward ledger
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/validate_mission_runtime.gd 2>&1 | tee "$RUNNER_TEMP/mission-runtime-test.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/mission-runtime-test.log"; then
            echo "Mission progression or reward validation failed." >&2
            exit 1
          fi

      - name: Validate save migration and gameplay persistence
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/validate_save_service_migration.gd 2>&1 | tee "$RUNNER_TEMP/save-service-test.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/save-service-test.log"; then
            echo "Save migration or gameplay persistence validation failed." >&2
            exit 1
          fi

      - name: Validate integrated gameplay runtime
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . --script res://tests/validate_gameplay_runtime_integration.gd 2>&1 | tee "$RUNNER_TEMP/gameplay-runtime-integration.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/gameplay-runtime-integration.log"; then
            echo "Integrated gameplay runtime validation failed." >&2
            exit 1
          fi

      - name: Validate Sana Hub prototype and relay activity
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . --script res://tests/validate_sana_hub_prototype.gd 2>&1 | tee "$RUNNER_TEMP/sana-hub-test.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/sana-hub-test.log"; then
            echo "Sana Hub prototype validation failed." >&2
            exit 1
          fi
      - name: Validate Mars rover survey and staged open assets
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . --script res://tests/validate_mars_rover_survey.gd 2>&1 | tee "$RUNNER_TEMP/mars-rover-survey.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/mars-rover-survey.log"; then
            echo "Mars rover survey or open-asset validation failed." >&2
            exit 1
          fi

      - name: Validate lunar outpost builder and staged CC0 assets
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . --script res://tests/validate_lunar_outpost_builder.gd 2>&1 | tee "$RUNNER_TEMP/lunar-outpost-builder.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/lunar-outpost-builder.log"; then
            echo "Lunar outpost builder or open-asset validation failed." >&2
            exit 1
          fi

      - name: Validate lunar rover route planner
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . --script res://tests/validate_lunar_rover_route_planner.gd 2>&1 | tee "$RUNNER_TEMP/lunar-rover-routes.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/lunar-rover-routes.log"; then
            echo "Lunar rover route planner validation failed." >&2
            exit 1
          fi

      - name: Validate standalone prototype showcase
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . --script res://tests/validate_showcase_app.gd 2>&1 | tee "$RUNNER_TEMP/showcase-app.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/showcase-app.log"; then
            echo "Prototype showcase validation failed." >&2
            exit 1
          fi

      - name: Run main-scene smoke test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee "$RUNNER_TEMP/main-smoke.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/main-smoke.log"; then
            echo "The main scene reported a runtime or script error." >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ''

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          sdkmanager --sdk_root="$SDK_ROOT" --licenses < <(yes)
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmake;3.10.2.4988404"

          # NDK archives are large; a partial/corrupt SDK Manager cache can otherwise
          # make every retry fail with "Error on ZipFile unknown archive".
          NDK_VERSION="28.1.13356709"
          NDK_PACKAGE="ndk;$NDK_VERSION"
          NDK_DIR="$SDK_ROOT/ndk/$NDK_VERSION"
          NDK_INSTALLED=false
          for attempt in 1 2 3; do
            echo "Installing $NDK_PACKAGE (attempt $attempt/3)"
            if sdkmanager --sdk_root="$SDK_ROOT" "$NDK_PACKAGE" \
              && test -f "$NDK_DIR/source.properties"; then
              NDK_INSTALLED=true
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "::warning::NDK installation failed; clearing partial SDK download cache before retry."
              rm -rf "$SDK_ROOT/.downloadIntermediates" "$NDK_DIR"
              sleep 6
            fi
          done

          if [ "$NDK_INSTALLED" != true ]; then
            echo "NDK $NDK_VERSION could not be installed after three clean attempts." >&2
            exit 1
          fi
          grep -F "Pkg.Revision = $NDK_VERSION" "$NDK_DIR/source.properties"

      - name: Create temporary debug signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/cosmic-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android export paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/adb = "$ANDROID_HOME/platform-tools/adb"
          export/android/jarsigner = "$JAVA_HOME/bin/jarsigner"
          export/android/debug_keystore = "$RUNNER_TEMP/cosmic-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/CosmicExplorers-Android-debug.apk 2>&1 | tee "$RUNNER_TEMP/android-export.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/android-export.log"; then
            echo "Godot reported an error during Android export." >&2
            exit 1
          fi
          test -s build/CosmicExplorers-Android-debug.apk
          unzip -t build/CosmicExplorers-Android-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.1/aapt"
          "$AAPT" dump badging build/CosmicExplorers-Android-debug.apk | tee build/apk-badging.txt
          grep -F "package: name='org.mdznap35.cosmicexplorers'" build/apk-badging.txt
          "$AAPT" dump permissions build/CosmicExplorers-Android-debug.apk | tee build/apk-permissions.txt
          if grep -q "android.permission.INTERNET" build/apk-permissions.txt; then
            echo "Unexpected internet permission in the offline-first child app." >&2
            exit 1
          fi
          sha256sum build/CosmicExplorers-Android-debug.apk

      - name: Export standalone Sana Hub preview APK
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_PROJECT="$RUNNER_TEMP/project.godot.before-sana"
          ORIGINAL_PRESETS="$RUNNER_TEMP/export_presets.before-sana"
          cp project.godot "$ORIGINAL_PROJECT"
          cp export_presets.cfg "$ORIGINAL_PRESETS"
          restore_project_files() {
            cp "$ORIGINAL_PROJECT" project.godot
            cp "$ORIGINAL_PRESETS" export_presets.cfg
          }
          trap restore_project_files EXIT

          python3 - <<'PY'
          from pathlib import Path

          project_path = Path("project.godot")
          project = project_path.read_text(encoding="utf-8")
          import re

          new_main = 'run/main_scene="res://scenes/prototypes/sana_hub_prototype.tscn"'
          project, replacements = re.subn(
              r'^run/main_scene="[^"]+"

          presets_path = Path("export_presets.cfg")
          presets = presets_path.read_text(encoding="utf-8")
          replacements = {
              'package/unique_name="org.mdznap35.cosmicexplorers"': 'package/unique_name="org.mdznap35.cosmicexplorers.sanahubpreview"',
              'package/name="مستكشفو الكون"': 'package/name="مستكشفو الكون — تجربة سَنا"',
              'version/name="0.1.0"': 'version/name="0.1.0-sana-preview"',
          }
          for old, new in replacements.items():
              if presets.count(old) != 1:
                  raise SystemExit(f"Expected exactly one export setting: {old}")
              presets = presets.replace(old, new, 1)
          presets_path.write_text(presets, encoding="utf-8")
          PY

          godot --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/sana-hub-import.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/sana-hub-import.log"; then
            echo "Sana Hub preview resource import failed." >&2
            exit 1
          fi

          godot --headless --path . --export-debug "Android" build/CosmicExplorers-SanaHub-Prototype.apk 2>&1 | tee "$RUNNER_TEMP/sana-hub-export.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/sana-hub-export.log"; then
            echo "Sana Hub preview APK export failed." >&2
            exit 1
          fi
          test -s build/CosmicExplorers-SanaHub-Prototype.apk
          unzip -t build/CosmicExplorers-SanaHub-Prototype.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.1/aapt"
          "$AAPT" dump badging build/CosmicExplorers-SanaHub-Prototype.apk | tee build/sana-hub-apk-badging.txt
          grep -F "package: name='org.mdznap35.cosmicexplorers.sanahubpreview'" build/sana-hub-apk-badging.txt
          "$AAPT" dump permissions build/CosmicExplorers-SanaHub-Prototype.apk | tee build/sana-hub-apk-permissions.txt
          if grep -q "android.permission.INTERNET" build/sana-hub-apk-permissions.txt; then
            echo "Unexpected internet permission in the offline Sana Hub preview." >&2
            exit 1
          fi
          sha256sum build/CosmicExplorers-SanaHub-Prototype.apk

          restore_project_files
          trap - EXIT

      - name: Upload standalone Sana Hub preview APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CosmicExplorers-SanaHub-Prototype
          path: build/CosmicExplorers-SanaHub-Prototype.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CosmicExplorers-Android-debug
          path: build/CosmicExplorers-Android-debug.apk
          if-no-files-found: error
          retention-days: 14
,
              new_main,
              project,
              count=1,
              flags=re.MULTILINE,
          )
          if replacements != 1:
              raise SystemExit("Expected exactly one main-scene setting to replace.")
          project_path.write_text(project, encoding="utf-8")

          presets_path = Path("export_presets.cfg")
          presets = presets_path.read_text(encoding="utf-8")
          replacements = {
              'package/unique_name="org.mdznap35.cosmicexplorers"': 'package/unique_name="org.mdznap35.cosmicexplorers.sanahubpreview"',
              'package/name="مستكشفو الكون"': 'package/name="مستكشفو الكون — تجربة سَنا"',
              'version/name="0.1.0"': 'version/name="0.1.0-sana-preview"',
          }
          for old, new in replacements.items():
              if presets.count(old) != 1:
                  raise SystemExit(f"Expected exactly one export setting: {old}")
              presets = presets.replace(old, new, 1)
          presets_path.write_text(presets, encoding="utf-8")
          PY

          godot --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/sana-hub-import.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/sana-hub-import.log"; then
            echo "Sana Hub preview resource import failed." >&2
            exit 1
          fi

          godot --headless --path . --export-debug "Android" build/CosmicExplorers-SanaHub-Prototype.apk 2>&1 | tee "$RUNNER_TEMP/sana-hub-export.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:|Parse Error:' "$RUNNER_TEMP/sana-hub-export.log"; then
            echo "Sana Hub preview APK export failed." >&2
            exit 1
          fi
          test -s build/CosmicExplorers-SanaHub-Prototype.apk
          unzip -t build/CosmicExplorers-SanaHub-Prototype.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.1/aapt"
          "$AAPT" dump badging build/CosmicExplorers-SanaHub-Prototype.apk | tee build/sana-hub-apk-badging.txt
          grep -F "package: name='org.mdznap35.cosmicexplorers.sanahubpreview'" build/sana-hub-apk-badging.txt
          "$AAPT" dump permissions build/CosmicExplorers-SanaHub-Prototype.apk | tee build/sana-hub-apk-permissions.txt
          if grep -q "android.permission.INTERNET" build/sana-hub-apk-permissions.txt; then
            echo "Unexpected internet permission in the offline Sana Hub preview." >&2
            exit 1
          fi
          sha256sum build/CosmicExplorers-SanaHub-Prototype.apk

          restore_project_files
          trap - EXIT

      - name: Upload standalone Sana Hub preview APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CosmicExplorers-SanaHub-Prototype
          path: build/CosmicExplorers-SanaHub-Prototype.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CosmicExplorers-Android-debug
          path: build/CosmicExplorers-Android-debug.apk
          if-no-files-found: error
          retention-days: 14
